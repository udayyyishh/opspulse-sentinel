apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse-sentinel
  namespace: opspulse-monitoring
  labels:
    app.kubernetes.io/name: opspulse
    app.kubernetes.io/component: monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opspulse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspulse
        app.kubernetes.io/component: monitor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: opspulse
          image: opspulse-sentinel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/etc/opspulse/targets.yaml"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-volume
              mountPath: /etc/opspulse
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: opspulse-config
