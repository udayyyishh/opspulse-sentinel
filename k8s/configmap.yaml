apiVersion: v1
kind: ConfigMap
metadata:
  name: opspulse-config
  namespace: opspulse-monitoring
  labels:
    app.kubernetes.io/name: opspulse
data:
  targets.yaml: |
    settings:
      poll_interval_seconds: 15
      request_timeout_seconds: 5.0
      enable_console_alerts: true

    targets:
      - id: "k8s-api-server"
        name: "Kubernetes API Health"
        url: "https://kubernetes.default.svc/healthz"
        method: "GET"
        expected_status: 200
        max_latency_ms: 300.0
        critical: true

      - id: "public-upstream-gateway"
        name: "Public Upstream Gateway"
        url: "https://httpbin.org/status/200"
        method: "GET"
        expected_status: 200
        max_latency_ms: 1200.0
        critical: false
