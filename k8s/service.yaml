apiVersion: v1
kind: Service
metadata:
  name: opspulse-service
  namespace: opspulse-monitoring
  labels:
    app.kubernetes.io/name: opspulse
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opspulse
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
